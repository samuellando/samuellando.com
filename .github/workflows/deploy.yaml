name: Deploy to cloud run
on:
  push:
    branches:
      - master

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: Check Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'gofmt -w .'"
            exit 1
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      DB_PORT: 5432
      DB_HOST: localhost
      DB_USER: actionuser
      DB_PASSWORD: actionpassword
      DB_NAME: testdb
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: actionuser
          POSTGRES_PASSWORD: actionpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: set up sqlc 
        uses: sqlc-dev/setup-sqlc@v3
        with:
          sqlc-version: '1.28.0'
      - name: Generate sqlc
        run: sqlc generate
      - name: Run Tests
        run: go test -v ./...
      - name: Run WASM Tests
        run: GOOS=js GOARCH=wasm go test ./wasm/...

  build:
    needs: [test]
    uses: samuellando/actions/.github/workflows/build-push.yml@main
    with:
      image: ghcr.io/samuellando/samuellando.com

  build-migrations:
    needs: [test]
    uses: samuellando/actions/.github/workflows/build-push.yml@main
    with:
      image: ghcr.io/samuellando/samuellando.com-migrations
      file: migrations.dockerfile

  migrate:
    runs-on: ubuntu-latest
    needs: [build-migrations]
    env:
      IMAGE_NAME: ${{ needs.build-migrations.outputs.IMAGE_NAME }}
    steps:
      - name: Set up Google Cloud authentication
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - name: Deploy to Cloud Run
        run: |
          gcloud run jobs deploy migrations --image ghcr.io/samuellando/samuellando.com-migrations:${{ needs.build-migrations.outputs.image_tag }} \
          --region us-central1
          gcloud run jobs execute migrations --wait --region us-central1

  deploy:
    runs-on: ubuntu-latest
    needs: [build, migrate]
    env:
      IMAGE_NAME: ${{ needs.build.outputs.IMAGE_NAME }}
    steps:
      - name: Set up Google Cloud authentication
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy samuellando-com --image ghcr.io/samuellando/samuellando.com:${{ needs.build.outputs.image_tag }} \
          --region us-central1
